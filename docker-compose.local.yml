services:
  mysql:
    image: mysql:8.0
    container_name: aukus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: aukus4
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - aukus-local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppass"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aukus-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: pass
    ports:
      - "8080:80"
    networks:
      - aukus-local
    depends_on:
      mysql:
        condition: service_healthy

  eventlab-backend:
    build:
      context: ../eventlab-api-core
      dockerfile: Dockerfile
    container_name: eventlab-backend-aukus
    environment:
      - ENV=docker
      - DB_URL=mysql+asyncmy://root:pass@mysql:3306/eventlab
      - CORS_ORIGINS=http://localhost:8092,http://localhost:5173
      - NODE_ENV=development
      - DB_QUERY_LOGGING=true
      - RUN_SEEDS=true
    ports:
      - "8094:8000"
    networks:
      - aukus-local
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  aukus-backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: aukus-backend-local
    environment:
      - AUKUS_DATABASE_URL=mysql+asyncmy://root:pass@mysql:3306/aukus4
      - EVENTLAB_DATABASE_URL=mysql+asyncmy://root:pass@mysql:3306/eventlab
      - EVENTLAB_API_URL=http://eventlab-backend:8000
      - PORT=8000
      - CORS_ORIGINS=http://localhost:8092,http://localhost:5173
      - NODE_ENV=development
      - DB_QUERY_LOGGING=true
      - RUN_SEEDS=true
    ports:
      - "8093:8000"
    networks:
      - aukus-local
    depends_on:
      mysql:
        condition: service_healthy
      eventlab-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  aukus-local:
    driver: bridge

volumes:
  mysql_data:
