[tools]
python = "3.13"

[settings.python]
venv_auto_create = true
uv_venv_auto = true

[tasks]
[tasks.start-dev]
description = "Start development server"
run = "./scripts/start-dev.sh"

[tasks.install]
description = "Install all Python dependencies into the venv"
run = "PIP_CONFIG_FILE=/dev/null pip install -r requirements.txt"
