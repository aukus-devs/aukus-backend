name: Docker build and deploy to docker hub

on:
  push:
    branches: [ "v2025-prod" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: olegsvs/aukus:2025-prod

      - name: Aukus 2025 docker build and deploy to hub failure!
        uses: rjstone/discord-webhook-notify@v1
        if: failure()
        with:
          severity: error
          details: Aukus 2025 docker build and deploy to hub failure!
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}

  call-deploy-to-aukus-fun:
    needs: deploy
    uses: ./.github/workflows/docker_build_and_deploy_aukus.fun.yml

  call-deploy-to-aukus-su:
    needs: deploy
    uses: ./.github/workflows/docker_build_and_deploy_aukus.su.yml
