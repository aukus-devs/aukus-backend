name: Docker pull to aukus.fun

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_AUKUS_FUN }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          command_timeout: 2m
          script: docker pull olegsvs/aukus:2025-prod && docker stop aukus_2025_prod || true && docker rm aukus_2025_prod || true && docker run -d --env-file /home/aukus/.env_2025_prod --net=host --name aukus_2025_prod -it olegsvs/aukus:2025-prod

      - name: Success to discord
        uses: rjstone/discord-webhook-notify@v1
        if: success()
        with:
          severity: info
          details: Aukus backend v2025 upload to aukus.fun success!
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Aukus backend v2025 upload failure!
        uses: rjstone/discord-webhook-notify@v1
        if: failure()
        with:
          severity: error
          details: Aukus backend upload to aukus.fun failure!
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
