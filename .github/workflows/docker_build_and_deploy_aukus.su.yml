name: Docker pull to aukus.su

on:
  workflow_call:
    inputs:
      host:
        description: "Host for SSH"
        required: true
        type: string
      username:
        description: "Username for SSH"
        required: true
        type: string
      password:
        description: "Password for SSH"
        required: true
        type: string
      port:
        description: "Port for SSH"
        required: true
        type: string
      webhook_url:
        description: "Discord webhook URL"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ inputs.host }}
          username: ${{ inputs.username }}
          password: ${{ inputs.password }}
          port: ${{ inputs.port }}
          command_timeout: 2m
          script: docker pull olegsvs/aukus:2025-prod && docker stop aukus_2025_prod || true && docker rm aukus_2025_prod || true && docker run -d --env-file /home/aukus/.env_2025_prod --net=host --name aukus_2025_prod -it olegsvs/aukus:2025-prod

      - name: Success to discord
        uses: rjstone/discord-webhook-notify@v1
        if: success()
        with:
          severity: info
          details: Aukus backend v2025 upload to aukus.su success!
          webhookUrl: ${{ inputs.webhook_url }}

      - name: Aukus backend v2025 upload failure!
        uses: rjstone/discord-webhook-notify@v1
        if: failure()
        with:
          severity: error
          details: Aukus backend upload to aukus.su failure!
          webhookUrl: ${{ inputs.webhook_url }}
